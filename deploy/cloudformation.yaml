AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IDBI Unified Agentic Platform — Deployment using existing VPC.
  CloudFront → ALB → EC2 with Nginx, FastAPI, Next.js.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for emergency SSH access
  GitRepoUrl:
    Type: String
    Default: https://github.com/SK314-Manoranjan-Pathak/IDBI-unified-agentic-platform.git
  GitBranch:
    Type: String
    Default: ML-pipeline
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.large, t3.xlarge, m6i.large, m6i.xlarge]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0a9c421eff4cd5e8d
    Description: Existing VPC ID
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0271cd800d2e4ab6b
    Description: Public subnet AZ-a (for ALB + EC2)
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0bb706995839d483e
    Description: Public subnet AZ-b (for ALB)

Resources:

  # ========================================================================
  # Security Groups
  # ========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP from anywhere (CloudFront)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: idbi-alb-sg

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 - allow port 80 from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: idbi-ec2-sg

  # ========================================================================
  # IAM Role (SSM + S3 + Bedrock)
  # ========================================================================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ========================================================================
  # S3 Bucket (model artifacts)
  # ========================================================================
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ========================================================================
  # EC2 Instance (public subnet, SG blocks direct access)
  # ========================================================================
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          SubnetId: !Ref PublicSubnetA
          GroupSet:
            - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: idbi-platform-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex
          exec > /var/log/user-data.log 2>&1

          dnf update -y
          dnf install -y git nginx python3.12 python3.12-pip python3.12-devel gcc

          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          npm install -g pm2

          git clone --branch ${GitBranch} ${GitRepoUrl} /opt/idbi-platform
          cd /opt/idbi-platform

          python3.12 -m venv /opt/idbi-platform/venv
          source /opt/idbi-platform/venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          cd /opt/idbi-platform/frontend
          npm install
          npm run build

          cp /opt/idbi-platform/deploy/nginx.conf /etc/nginx/conf.d/idbi.conf
          rm -f /etc/nginx/conf.d/default.conf
          sed -i 's/listen.*80.*default_server/# &/' /etc/nginx/nginx.conf
          nginx -t && systemctl enable nginx && systemctl start nginx

          cp /opt/idbi-platform/deploy/idbi-backend.service /etc/systemd/system/
          systemctl daemon-reload
          systemctl enable idbi-backend

          cd /opt/idbi-platform/frontend
          pm2 start /opt/idbi-platform/deploy/ecosystem.config.cjs
          pm2 save
          pm2 startup systemd -u root --hp /root

          aws s3 sync s3://${DataBucket}/data/ /opt/idbi-platform/data/ --region ap-south-1 || true

          systemctl start idbi-backend
          echo "=== DEPLOYMENT COMPLETE ==="

  # ========================================================================
  # ALB
  # ========================================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: idbi-platform-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: idbi-platform-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref EC2Instance
          Port: 80

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ========================================================================
  # CloudFront
  # ========================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: IDBI Agentic Platform
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true
          Compress: true
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        PriceClass: PriceClass_200
        HttpVersion: http2

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
  InstanceId:
    Value: !Ref EC2Instance
  DataBucketName:
    Value: !Ref DataBucket
